<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BUIC Admin Portal</title>
  <meta name="description" content="Sign in to the BUIC Seerah Competition 2026 admin portal.">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="login-page">

  <div class="bg-glow-container" aria-hidden="true">
    <div class="bg-glow-orb bg-glow-orb-1"></div>
    <div class="bg-glow-orb bg-glow-orb-2"></div>
    <div class="login-grid-overlay"></div>
  </div>

  <div id="header-placeholder"></div>

  <main class="main-content login-main">
    <div class="container login-container">

      <div class="login-card">
        <div class="login-card-glow" aria-hidden="true"></div>

        <div class="login-card-header">
          <div class="login-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <p class="login-eyebrow">BUIC Admin Portal</p>
          <h1 class="login-title">Admin Sign In</h1>
          <p class="login-subtitle">
            Enter your credentials to manage registrations and book orders.
          </p>
        </div>

        <div id="login-alert" class="login-alert" hidden></div>

        <form id="admin-login-form" class="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">
              Username <span class="required">*</span>
            </label>
            <input type="text" id="username" class="form-input" placeholder="Enter admin username" required
              autofocus autocomplete="username">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              Password <span class="required">*</span>
            </label>
            <div class="login-password-field">
              <input type="password" id="password" class="form-input" placeholder="Enter your password" required
                autocomplete="current-password">
              <button type="button" id="toggle-password" class="login-password-toggle"
                title="Show or hide password" aria-label="Show or hide password">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  style="display:none;" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="login-btn" class="btn btn-gold login-submit">
            Sign In
          </button>
        </form>

        <div class="login-footer-note">
          Regular users should use the
          <a href="/register">registration page</a>
          instead.
        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/main.js"></script>
  <script src="/js/login.js"></script>
</body>

</html>
